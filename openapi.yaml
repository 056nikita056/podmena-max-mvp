openapi: 3.1.0
info:
  title: Подмена API
  version: 0.1.0
  description: API MVP. Внешние площадки и кандидаты смоделированы. URL сервера заменяется при развёртывании.
servers:
  - url: https://YOUR_DOMAIN
  - url: http://localhost:3000
tags:
  - name: Auth
  - name: Shifts
  - name: Demo
  - name: MAX
paths:
  /api/health:
    get:
      summary: Проверка процесса и базы
      responses:
        '200': { description: Готово, content: { application/json: { schema: { type: object, required: [ok, database], properties: { ok: { type: boolean }, database: { type: string } } } } } }
  /api/auth/max:
    post:
      tags: [Auth]
      summary: Вход через подписанную строку MAX Bridge
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [initData], properties: { initData: { type: string, maxLength: 8192 } } } } }
      responses:
        '200': { description: Сессия создана; HttpOnly cookie, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /api/auth/demo:
    post:
      tags: [Auth, Demo]
      summary: Изолированный локальный вход, только ENABLE_BROWSER_DEMO=1
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [persona], properties: { persona: { type: string, enum: [manager, reviewer] } } } } }
      responses:
        '200': { description: Сессия создана; HttpOnly cookie, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/bootstrap:
    get:
      tags: [Shifts]
      security: [{ cookieAuth: [] }]
      summary: Бизнес, точки и резерв текущего управляющего
      responses:
        '200': { description: Начальные данные, content: { application/json: { schema: { type: object, required: [business, sites, reserve], properties: { business: { type: object }, sites: { type: array, items: { type: object } }, reserve: { type: array, items: { type: object } } } } } } }
        '401': { $ref: '#/components/responses/Error' }
  /api/shifts:
    get:
      tags: [Shifts]
      security: [{ cookieAuth: [] }]
      summary: Заявки текущего управляющего
      responses:
        '200': { description: Список, content: { application/json: { schema: { type: object, required: [shifts], properties: { shifts: { type: array, items: { $ref: '#/components/schemas/Shift' } } } } } } }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [Shifts]
      security: [{ cookieAuth: [] }]
      summary: Создать заявку
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateShift' } } } }
      responses:
        '201': { description: Создано, content: { application/json: { schema: { $ref: '#/components/schemas/ShiftDetail' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/shifts/{id}:
    get:
      tags: [Shifts]
      security: [{ cookieAuth: [] }]
      summary: Заявка, источники, отклики, сообщения, предложение, история
      parameters: [{ $ref: '#/components/parameters/ShiftId' }]
      responses:
        '200': { description: Детали, content: { application/json: { schema: { $ref: '#/components/schemas/ShiftDetail' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/shifts/{id}/search:
    post:
      tags: [Shifts]
      security: [{ cookieAuth: [] }]
      summary: Идемпотентный модельный поиск и статусы источников
      parameters: [{ $ref: '#/components/parameters/ShiftId' }]
      responses:
        '200': { description: Результат, content: { application/json: { schema: { $ref: '#/components/schemas/ShiftDetail' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/shifts/{id}/messages:
    post:
      tags: [Shifts]
      security: [{ cookieAuth: [] }]
      summary: Сохранить сообщение и модельный ответ
      parameters: [{ $ref: '#/components/parameters/ShiftId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [candidateId, text], properties: { candidateId: { type: integer }, text: { type: string, minLength: 1, maxLength: 1000 } } } } } }
      responses:
        '201': { description: Сообщения сохранены, content: { application/json: { schema: { $ref: '#/components/schemas/ShiftDetail' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/shifts/{id}/offer:
    post:
      tags: [Shifts]
      security: [{ cookieAuth: [] }]
      summary: Зафиксировать предложение без автоматического закрытия смены
      parameters: [{ $ref: '#/components/parameters/ShiftId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [candidateId], properties: { candidateId: { type: integer } } } } } }
      responses:
        '200': { description: Ожидается подтверждение, content: { application/json: { schema: { $ref: '#/components/schemas/ShiftDetail' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/shifts/{id}/demo-decision:
    post:
      tags: [Demo]
      security: [{ cookieAuth: [] }]
      summary: Отдельное модельное подтверждение или отказ кандидата
      parameters: [{ $ref: '#/components/parameters/ShiftId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [confirm, decline] } } } } } }
      responses:
        '200': { description: Решение применено, content: { application/json: { schema: { $ref: '#/components/schemas/ShiftDetail' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/shifts/{id}/attendance:
    post:
      tags: [Shifts]
      security: [{ cookieAuth: [] }]
      summary: Тестовая отметка выхода или невыхода управляющим
      parameters: [{ $ref: '#/components/parameters/ShiftId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [value], properties: { value: { type: string, enum: [arrived, no_show] } } } } } }
      responses:
        '200': { description: Состояние обновлено, content: { application/json: { schema: { $ref: '#/components/schemas/ShiftDetail' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/shifts/{id}/cancel:
    post:
      tags: [Shifts]
      security: [{ cookieAuth: [] }]
      summary: Отменить заявку и закрыть модельные обращения
      parameters: [{ $ref: '#/components/parameters/ShiftId' }]
      responses:
        '200': { description: Отменено, content: { application/json: { schema: { $ref: '#/components/schemas/ShiftDetail' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/shifts/{id}/reserve:
    post:
      tags: [Shifts]
      security: [{ cookieAuth: [] }]
      summary: Сохранить согласованного кандидата в резерв
      parameters: [{ $ref: '#/components/parameters/ShiftId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [candidateId], properties: { candidateId: { type: integer } } } } } }
      responses:
        '200': { description: Резерв, content: { application/json: { schema: { type: object, required: [reserve], properties: { reserve: { type: array, items: { type: object } } } } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/reserve:
    get:
      tags: [Shifts]
      security: [{ cookieAuth: [] }]
      summary: Список резерва текущего управляющего
      responses:
        '200': { description: Резерв, content: { application/json: { schema: { type: object, required: [reserve], properties: { reserve: { type: array, items: { type: object } } } } } } }
        '401': { $ref: '#/components/responses/Error' }
  /api/demo/reset:
    post:
      tags: [Demo]
      security: [{ cookieAuth: [] }]
      summary: Удалить заявки и резерв только текущего демо-пространства
      responses:
        '200': { description: Начальные данные, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/max/webhook:
    post:
      tags: [MAX]
      summary: События MAX; заголовок сверяется с MAX_WEBHOOK_SECRET
      parameters:
        - name: X-Max-Bot-Api-Secret
          in: header
          required: true
          schema: { type: string }
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: Событие принято, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: podmena_session }
  parameters:
    ShiftId: { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
  responses:
    Error:
      description: Ошибка запроса или состояния
      content: { application/json: { schema: { type: object, required: [error], properties: { error: { type: string } } } } }
  schemas:
    Ok: { type: object, required: [ok], properties: { ok: { type: boolean } } }
    CreateShift:
      type: object
      required: [siteId, role, startsAt, endsAt, payRub, skills, description, decisionDeadline, sources]
      properties:
        siteId: { type: integer }
        role: { type: string, const: Бариста }
        startsAt: { type: string, format: date-time, description: UTC ISO 8601 }
        endsAt: { type: string, format: date-time, description: UTC ISO 8601 }
        payRub: { type: integer, minimum: 1000, maximum: 100000, description: Оплата человеку за всю смену }
        skills: { type: array, minItems: 1, maxItems: 8, items: { type: string } }
        description: { type: string, maxLength: 500 }
        decisionDeadline: { type: string, format: date-time }
        sources: { type: array, minItems: 1, uniqueItems: true, items: { type: string, enum: [staff, reserve, youdo, profi] } }
        scenario: { type: string, enum: [success, no_results, decline, source_error], default: success }
    Shift:
      type: object
      required: [id, site_id, site_name, role, starts_at, ends_at, payRub, skills, sources, scenario, status]
      properties:
        id: { type: integer }
        site_id: { type: integer }
        site_name: { type: string }
        site_address: { type: string }
        role: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        payRub: { type: number }
        skills: { type: array, items: { type: string } }
        description: { type: string }
        decision_deadline: { type: string, format: date-time }
        sources: { type: array, items: { type: string } }
        scenario: { type: string }
        status: { type: string, enum: [draft, searching, awaiting_confirmation, confirmed, completed, cancelled, unfilled] }
    ShiftDetail:
      type: object
      required: [shift, publications, responses, messages, offer, events]
      properties:
        shift: { $ref: '#/components/schemas/Shift' }
        publications: { type: array, items: { type: object, required: [source, status, detail], properties: { source: { type: string }, status: { type: string, enum: [sent, failed, closed] }, detail: { type: string } } } }
        responses: { type: array, items: { type: object, required: [candidateId, name, source, rateRub, skills, reasons, available], properties: { candidateId: { type: integer }, name: { type: string }, source: { type: string }, rateRub: { type: number }, skills: { type: array, items: { type: string } }, reasons: { type: array, items: { type: string } }, available: { type: boolean } } } }
        messages: { type: array, items: { type: object, required: [candidateId, sender, text, modelled, createdAt], properties: { candidateId: { type: integer }, sender: { type: string, enum: [manager, candidate] }, text: { type: string }, modelled: { type: boolean }, createdAt: { type: string, format: date-time } } } }
        offer: { oneOf: [{ type: 'null' }, { type: object, required: [candidateId, status, startsAt, endsAt, payRub, siteName, name], properties: { candidateId: { type: integer }, status: { type: string, enum: [pending, confirmed, declined, cancelled] }, startsAt: { type: string, format: date-time }, endsAt: { type: string, format: date-time }, payRub: { type: number }, siteName: { type: string }, name: { type: string } } }] }
        events: { type: array, items: { type: object, required: [kind, text, createdAt], properties: { kind: { type: string }, text: { type: string }, createdAt: { type: string, format: date-time } } } }
